services:
  # Backend API Service
  - type: web
    name: gps-backend
    runtime: node
    plan: free
    repo: https://github.com/BOGCODING/ghana-police-recruitment-portal
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # Frontend Next.js Service
  - type: web
    name: gps-frontend
    runtime: node
    plan: free
    repo: https://github.com/BOGCODING/ghana-police-recruitment-portal
    rootDir: apps/frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false

  # Admin Next.js Service
  - type: web
    name: gps-admin
    runtime: node
    plan: free
    repo: https://github.com/BOGCODING/ghana-police-recruitment-portal
    rootDir: apps/admin
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

