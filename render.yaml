# Render Blueprint Specification
# This file defines the infrastructure for the Ghana Police Recruitment Portal.

services:
  # ---------------------------------------------------------------------------
  # 1. Backend API Service (Express)
  # ---------------------------------------------------------------------------
  - type: web
    name: gps-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm install -g pnpm@latest && pnpm install
    startCommand: pnpm run migrate && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: PNPM_VERSION
        value: 8.x
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=450"

  # ---------------------------------------------------------------------------
  # 2. Frontend Applicant Portal (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: gps-frontend
    runtime: node
    plan: free
    rootDir: apps/frontend
    buildCommand: npm install -g pnpm@latest && pnpm install && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: PNPM_VERSION
        value: 8.x
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://gps-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        sync: false # Set to wss://gps-backend.onrender.com
      - key: API_INTERNAL_URL
        value: http://gps-backend:5000
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=450"
      - key: PORT
        value: "10000"

  # ---------------------------------------------------------------------------
  # 3. Admin Dashboard (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: gps-admin
    runtime: node
    plan: free
    rootDir: apps/admin
    buildCommand: npm install -g pnpm@latest && pnpm install && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: PNPM_VERSION
        value: 8.x
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://gps-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        sync: false # Set to wss://gps-backend.onrender.com
      - key: API_INTERNAL_URL
        value: http://gps-backend:5000
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=450"
      - key: PORT
        value: "10000"
