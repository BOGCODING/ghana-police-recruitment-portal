# Render Blueprint Specification
# This file defines the infrastructure for the Ghana Police Recruitment Portal.

services:
  # ---------------------------------------------------------------------------
  # 1. Backend API Service (Express)
  # ---------------------------------------------------------------------------
  - type: web
    name: gps-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Applicant Portal (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: gps-frontend
    runtime: node
    plan: free
    rootDir: apps/frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://gps-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        sync: false # Set to wss://gps-backend.onrender.com

  # ---------------------------------------------------------------------------
  # 3. Admin Dashboard (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: gps-admin
    runtime: node
    plan: free
    rootDir: apps/admin
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://gps-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        sync: false # Set to wss://gps-backend.onrender.com
